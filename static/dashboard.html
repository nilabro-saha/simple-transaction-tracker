<!DOCTYPE html>
<html>
    <head>
        <title>Personal Finance Dashboard</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
        <link rel="stylesheet" href="/static/dashboard.css">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <!-- <link> -->
    </head>
    <body>

        <div class="app-layout">
            <!-- LEFT SIDEBAR -->
            <aside class="sidebar">
                <button id="refresh-btn">Refresh Data</button>
                
                <h2>Select Date Range</h2>
            
                <div class="filter-group">
                    <label for="startDate">From</label> 
                    <input type="date" id="startDate">
                </div>
                <div class="filter-group">
                    <label for="endDate">To</label>
                    <input type="date" id="endDate">
                </div>
                <div class="filter-group checkbox">
                    <input type="checkbox" id="disableDateFilter">
                    <label class="checkbox" for="disableDateFilter">All time</label>
                </div>
                <div class="filter-group date-filter">
                    <button id="applyDateFilter">Apply</button>
                </div>

                <h2>Select Months</h2>

                <div class="filter-group month-filter">
                    <button id="applyMonthFilter">Apply</button>
                </div>

                <div id="monthCheckboxes" class="months-scrollable-pane"></div>
            </aside>

            <!-- MAIN AREA -->
            <main class="main">
                <header class="app-header">
                    <h1>Nilabro's Asset Growth Dashboard</h1>
                </header>
                <section class="app-content">
                    <div class="dashboard">
                        <div class="chart-grid">
                            <div class="chart-card">
                                <section>
                                    <h2>Cashflow by Account</h2>
                                    <canvas id="cashflowChart"></canvas>
                                </section>
                            </div>
                            <div class="chart-card">
                                <section>
                                    <h2>Balance by Account</h2>
                                    <canvas id="balanceChart"></canvas>
                                </section>
                            </div>
                            <div class="chart-card">
                                <section>
                                    <h2>Cashflow Overall</h2>
                                    <label class="checkbox" for="enableRollingAverage">Rolling Average</label>
                                    <input type="checkbox" id="enableRollingAverage">
                                    <label class="checkbox" for="rollingWindow"> / Window:</label>
                                    <input class="checkbox" type="number" min="1" value="6" id="rollingWindow">
                                    <label class="checkbox" for="rollingWindow">months</label>
                                    <canvas id="overallCashflowChart"></canvas>
                                </section>
                            </div>
                            <div class="chart-card">
                                <section>
                                    <h2>Balance Overall</h2>
                                    <label class="checkbox" for="enableTrendline">Trendline</label>
                                    <input type="checkbox" id="enableTrendline">
                                    <label class="checkbox" for="extendByMonths"> / Predict ahead by</label>
                                    <input class="checkbox" type="number" min="0" value="6" id="extendByMonths">
                                    <label class="checkbox" for="extendByMonths">months</label>
                                    <canvas id="overallBalanceChart"></canvas>
                                </section>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>


        <script src="/static/dashboard.js"></script>
    </body>
</html>
